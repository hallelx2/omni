name: Release (desktop)

# Builds the Tauri desktop app into native installers (.msi/.exe, .dmg, .AppImage/.deb)
# on a runner per OS and attaches them to the tag's GitHub release. Tauri can't
# cross-compile desktop bundles, so — like the CLI release — each platform builds
# on its own runner. The sidecar (omni-desktop-server) is rebuilt per-runner via
# the desktop beforeBuildCommand ("bun run sidecar && bun run build").
#
# Triggers: push a tag like v0.1.0 (or v0.1.0-beta.1), or run manually.
# Uses the built-in GITHUB_TOKEN (no extra secret) to upload to the release.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: desktop ${{ matrix.key }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: windows-x64, os: windows-latest }
          - { key: darwin-arm64, os: macos-14 }
          # darwin-x64 (Intel Mac) dropped for v0.1.0 — no usable macos-13 runner.
          - { key: linux-x64, os: ubuntu-22.04 }
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (Rust build)
        uses: swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Linux build deps (webkit/gtk + AppImage FUSE)
        if: matrix.os == 'ubuntu-22.04'
        # libfuse2 lets the AppImage bundler (linuxdeploy, itself an AppImage)
        # mount itself — ubuntu-22.04 runners no longer ship it by default, which
        # is why bundling fails with "failed to run linuxdeploy".
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build + bundle + upload installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Belt-and-suspenders for the FUSE issue above: make AppImage tools
          # self-extract instead of FUSE-mounting, so bundling works on any runner.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          projectPath: packages/desktop
          # Attach installers to the tag's release (creates a draft if absent).
          tagName: ${{ github.ref_name }}
          releaseName: "omni ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
